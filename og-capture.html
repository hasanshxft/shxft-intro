<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Onest:wght@300;400;600;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #fafafa;
    font-family: 'Onest', sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    position: relative;
  }
  .wordmark {
    width: 320px; margin-bottom: 24px;
  }
  h1 {
    font-size: 28px; font-weight: 900; text-transform: uppercase;
    letter-spacing: 0.04em; color: #1a1a1a; line-height: 1.3;
  }
  .sub {
    font-size: 13px; font-weight: 400; color: #888;
    letter-spacing: 0.15em; text-transform: uppercase;
    margin-top: 16px;
  }
  .division {
    font-size: 10px; color: #bbb; letter-spacing: 0.12em;
    text-transform: uppercase; margin-top: 24px;
  }
  .division img { height: 14px; vertical-align: middle; margin-left: 6px; opacity: 0.4; }
</style>
</head><body>
  <img src="shxft-wordmark-black.png" class="wordmark" alt="SHXFT">
  <h1>Creative XR &<br>Innovation Studio</h1>
  <div class="sub">Strategy / Digital / Creative / Production</div>
  <div class="division">A Division of <img src="CNQR CONT BANNER.png" alt="CNQR Media"></div>
</body></html>
